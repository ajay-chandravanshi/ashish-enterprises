{% extends "base.html" %}
{% load static %}

{% block content %}

<link rel="stylesheet" href="{% static 'css/products.css' %}">

<div class="page-header">

    <div>

        <h1>
            <i class="bi bi-box-seam-fill"></i>
            Products
        </h1>

        <p>Manage all available products.</p>

    </div>

    <div class="header-actions">

        <div class="search-box">

            <i class="bi bi-search"></i>

            <input
                type="text"
                id="search"
                placeholder="Search product..."
                autocomplete="off"
            >

        </div>

        <a href="{% url 'add_product' %}" class="add-btn">

            <i class="bi bi-plus-circle"></i>

            Add Product

        </a>

    </div>

</div>

<div class="table-card">

    <table>

        <thead>

            <tr>

                <th>SR.</th>
                <th>Product Name</th>
                <th>Action</th>

            </tr>

        </thead>

        <tbody id="table-body">

            {% include "partials/product_table.html" %}

        </tbody>

    </table>

</div>

<script>

let timer;

const search = document.getElementById("search");

search.addEventListener("keyup", function () {

    clearTimeout(timer);

    timer = setTimeout(function () {

        fetch("/products/?search=" + encodeURIComponent(search.value), {

            headers: {
                "X-Requested-With": "XMLHttpRequest"
            }

        })
        .then(response => response.json())
        .then(data => {

            document.getElementById("table-body").innerHTML = data.html;

        });

    }, 300);

});

</script>

{% endblock %}
