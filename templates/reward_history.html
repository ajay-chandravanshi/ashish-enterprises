{% extends "base.html" %}
{% load static %}

{% block content %}

<link rel="stylesheet" href="{% static 'css/reward_history.css' %}">

<div class="page-header">

    <div>

        <h1>

            <i class="bi bi-award-fill"></i>

            Reward History

        </h1>

        <p>Manage all reward history records.</p>

    </div>

    <div class="header-actions">

        <div class="search-box">

            <i class="bi bi-search"></i>

            <input
                type="text"
                id="search"
                placeholder="Search reward..."
                autocomplete="off"
            >

        </div>

    </div>

</div>

<div class="table-card">

    <table>

        <thead>

            <tr>

                <th>SR.</th>

                <th>Plumber</th>

                <th>Reward Product</th>

                <th>Qty</th>

                <th>Given Date</th>

                <th>Note</th>

                <th>Action</th>

            </tr>

        </thead>

        <tbody id="table-body">

            {% include "partials/reward_history_table.html" %}

        </tbody>

    </table>

</div>

<script>

let timer;

const search = document.getElementById("search");

search.addEventListener("keyup", function(){

    clearTimeout(timer);

    timer = setTimeout(function(){

        fetch("/reward-history/?search=" + encodeURIComponent(search.value),{

            headers:{
                "X-Requested-With":"XMLHttpRequest"
            }

        })

        .then(response => response.json())

        .then(data => {

            document.getElementById("table-body").innerHTML = data.html;

        });

    },300);

});

</script>

{% endblock %}
