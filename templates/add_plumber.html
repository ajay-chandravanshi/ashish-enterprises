{% extends "base.html" %} {% load static %} {% block content %}

<link rel="stylesheet" href="{% static 'css/form.css' %}" />

<div class="form-container">
  <div class="form-card">
    <div class="form-header">
      <h1>
        {% if plumber %}

        <i class="bi bi-pencil-square"></i> Edit Plumber {% else %}

        <i class="bi bi-person-plus-fill"></i> Add Plumber {% endif %}
      </h1>
      <p>Add a new plumber into the system.</p>
    </div>

    <form method="POST">
      {% csrf_token %}

      <div class="form-group">
        <label>Name</label>
        <input
          type="text"
          name="name"
          maxlength="30"
          value="{{ plumber.name|default:'' }}"
          required
        />
      </div>

      <div class="form-group">
        <label>Phone</label>
        <input
          type="text"
          name="phone"
          maxlength="10"
          pattern="[0-9]{10}"
          value="{{ plumber.phone|default:'' }}"
          required
        />
      </div>

      <div class="form-group">
        <label>Address</label>
        <textarea name="address" maxlength="200">
{{ plumber.address|default:'' }}</textarea
        >
      </div>

      <div class="button-group">
        <a href="{% url 'plumbers' %}" class="cancel-btn">
          <i class="bi bi-arrow-left"></i> Cancel
        </a>

        <button type="submit" class="save-btn">
          <i class="bi bi-check-circle-fill"></i>

          {% if plumber %} Update Plumber {% else %} Save Plumber {% endif %}
        </button>
      </div>
    </form>
  </div>
</div>

{% endblock %}
