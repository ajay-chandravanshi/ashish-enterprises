{% extends "base.html" %}
{% load static %}

{% block content %}

<link rel="stylesheet" href="{% static 'css/purchase_history.css' %}">

<div class="purchase-history-page">

    <div class="page-header">

        <div>

            <h1><i class="bi bi-cart-check-fill"></i> Purchase History</h1>

            <p>Manage all purchase records.</p>

        </div>

        <div class="header-actions">

            <div class="search-box">

                <i class="bi bi-search"></i>

                <input
                    type="text"
                    id="search"
                    placeholder="Search plumber..."
                    autocomplete="off"
                >

            </div>

            <a href="{% url 'add_purchase' %}" class="add-btn">

                <i class="bi bi-plus-circle"></i>

                Add Purchase

            </a>

        </div>

    </div>

    <div class="table-card">

        <table>

            <thead>

                <tr>

                    <th>SR.</th>
                    <th>Plumber</th>
                    <th>History</th>

                </tr>

            </thead>

            <tbody id="table-body">

                {% include "partials/purchase_table.html" %}

            </tbody>

        </table>

    </div>

</div>

<script>

let timer;

const search = document.getElementById("search");

search.addEventListener("keyup", function(){

    clearTimeout(timer);

    timer = setTimeout(function(){

        fetch("/purchase-history/?search=" + encodeURIComponent(search.value), {

            headers:{
                "X-Requested-With":"XMLHttpRequest"
            }

        })

        .then(response => response.json())

        .then(data => {

            document.getElementById("table-body").innerHTML = data.html;

        });

    },300);

});

</script>

{% endblock %}
