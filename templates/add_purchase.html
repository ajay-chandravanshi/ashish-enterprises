{% extends "base.html" %}
{% load static %}

{% block content %}

<link rel="stylesheet" href="{% static 'css/add_purchase.css' %}">

<div class="form-container">

    <div class="form-card">

        <div class="form-header">

            <h2>
                {% if purchase %}
                    ✏️ Edit Purchase
                {% else %}
                    🛒 Add Purchase
                {% endif %}
            </h2>

            <a href="{% url 'purchase_history' %}" class="back-btn">
                ← Back
            </a>

        </div>

        <form method="POST">

            {% csrf_token %}

            <div class="form-grid">

                <div class="form-group">

                    <label>Plumber</label>

                    <select name="plumber" required>

                        <option value="">Select Plumber</option>

                        {% for plumber in plumbers %}

                        <option value="{{ plumber.id }}"
                        {% if purchase and purchase.plumber.id == plumber.id %}selected{% endif %}>

                            {{ plumber.name }}

                        </option>

                        {% endfor %}

                    </select>

                </div>

                <div class="form-group">

                    <label>Product</label>

                    <select name="product" required>

                        <option value="">Select Product</option>

                        {% for product in products %}

                        <option value="{{ product.id }}"
                        {% if purchase and purchase.product.id == product.id %}selected{% endif %}>

                            {{ product.name }}

                        </option>

                        {% endfor %}

                    </select>

                </div>

                <div class="form-group">

                    <label>Quantity</label>

                    <input
                        type="number"
                        id="qty"
                        name="quantity"
                        min="1"
                        value="{% if purchase %}{{ purchase.quantity }}{% endif %}"
                        required
                    >

                </div>

                <div class="form-group">

                    <label>Rate (₹)</label>

                    <input
                        type="number"
                        id="rate"
                        name="rate"
                        min="0"
                        value="{% if purchase %}{{ purchase.rate }}{% endif %}"
                        required
                    >

                </div>

                <div class="form-group full-width">

                    <label>Purchase Date</label>

                    <input
                        type="date"
                        name="purchase_date"
                        value="{% if purchase %}{{ purchase.purchase_date|date:'Y-m-d' }}{% endif %}"
                        required
                    >

                </div>

                <div class="form-group full-width">

                    <label>Note</label>

                    <textarea
                        name="note"
                        rows="4"
                        placeholder="Enter note..."
                    >{% if purchase %}{{ purchase.note }}{% endif %}</textarea>

                </div>

            </div>

            <div class="button-group">

                <button type="submit" class="save-btn">

                    {% if purchase %}
                        Update Purchase
                    {% else %}
                        Save Purchase
                    {% endif %}

                </button>

            </div>

        </form>

    </div>

</div>


{% endblock %}
