{% extends "base.html" %}
{% load static %}

{% block content %}

<link rel="stylesheet" href="{% static 'css/reward_rules.css' %}">

<div class="page-header">

    <div>

        <h1>
            <i class="bi bi-gift-fill"></i>
            Reward Rules
        </h1>

        <p>Manage all reward rules.</p>

    </div>

    <div class="header-actions">

        <div class="search-box">

            <i class="bi bi-search"></i>

            <input
                type="text"
                id="search"
                placeholder="Search reward rule..."
                autocomplete="off"
            >

        </div>

        <a href="{% url 'add_reward_rule' %}" class="add-btn">

            <i class="bi bi-plus-circle"></i>

            Add Rule

        </a>

    </div>

</div>

<div class="table-card">

    <table>

        <thead>

            <tr>

                <th>SR.</th>
                <th>Purchase Product</th>
                <th>Buy Qty</th>
                <th>Reward Product</th>
                <th>Min Purchase</th>
                <th>Max Purchase</th>
                <th>Prize Type</th>
                <th>Reward</th>
                <th>Action</th>

            </tr>

        </thead>

        <tbody id="table-body">

            {% include "partials/reward_rule_table.html" %}

        </tbody>

    </table>

</div>

<script>

let timer;

const search = document.getElementById("search");

search.addEventListener("keyup",function(){

    clearTimeout(timer);

    timer=setTimeout(function(){

        fetch("/reward-rules/?search="+encodeURIComponent(search.value),{

            headers:{
                "X-Requested-With":"XMLHttpRequest"
            }

        })

        .then(response=>response.json())

        .then(data=>{

            document.getElementById("table-body").innerHTML=data.html;

        });

    },300);

});

</script>

{% endblock %}
